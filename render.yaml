services:
  - type: web
    name: notastore-apex
    runtime: static
    buildCommand: echo "Redirect NotAStore pronto"
    staticPublishPath: ./redirect
    routes:
      - type: redirect
        source: /*
        destination: https://www.notastore.shop
    autoDeploy: true

  - type: web
    name: notastore
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run seo
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_BASE_URL
        value: https://www.notastore.shop
      - key: NOTASTORE_ENABLE_SCHEDULED_CREDITS
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: NotAStore Accrediti <accrediti@notastore.shop>
      - key: NOTASTORE_ADMIN_EMAIL
        value: michaellupo2005@gmail.com
      - key: NOTASTORE_SOCIAL_CODE
        sync: false
