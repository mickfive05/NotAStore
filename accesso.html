<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f7f4">
  <title>Accesso privato — NotAStore</title>
  <link rel="icon" href="images/notastore-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; font-family: Manrope, sans-serif; background: #f7f7f4; color: #171717; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 390px); text-align: center; }
    img { width: min(270px, 78vw); height: auto; filter: brightness(0) saturate(100%) invert(54%) sepia(94%) saturate(3102%) hue-rotate(355deg) brightness(102%) contrast(101%); }
    h1 { margin: 28px 0 8px; font-size: clamp(27px, 7vw, 38px); letter-spacing: -.045em; }
    p { margin: 0 0 28px; color: #69645f; line-height: 1.55; }
    form { display: grid; gap: 12px; }
    input, button { min-height: 52px; border-radius: 14px; font: inherit; }
    input { width: 100%; border: 1px solid #d9d3cc; background: #fff; padding: 0 16px; outline: none; }
    input:focus { border-color: #f26a21; box-shadow: 0 0 0 3px rgba(242,106,33,.13); }
    button { border: 0; background: #f26a21; color: #fff; font-weight: 800; cursor: pointer; }
    .error { display: none; margin: 0 0 14px; color: #b42318; font-size: 14px; }
    body[data-error="true"] .error { display: block; }
    a { display: inline-block; margin-top: 22px; color: #69645f; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <img src="images/notastore-logo.png" alt="NotAStore" width="360" height="120">
    <h1>Accesso privato</h1>
    <p>Inserisci il codice riservato per aprire la versione completa di NotAStore.</p>
    <p class="error" role="alert">Codice non corretto. Riprova.</p>
    <form action="/api/preview-login" method="post">
      <input type="password" name="code" placeholder="Codice di accesso" autocomplete="current-password" required autofocus>
      <button type="submit">Entra in NotAStore</button>
    </form>
    <a href="/">Torna alla pagina di lancio</a>
  </main>
  <script>document.body.dataset.error = new URLSearchParams(location.search).has('errore');</script>
</body>
</html>
